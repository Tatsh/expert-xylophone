components:
  parameters:
    Target:
      description: 'The region code. Every endpoint takes it.'
      in: 'query'
      name: 'target'
      required: true
      schema:
        $ref: '#/components/schemas/RegionCode'
    UserInfoDevice:
      in: 'query'
      name: 'device'
      required: true
      schema:
        $ref: '#/components/schemas/DeviceName'
    UserInfoDeviceOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'device'
      required: false
      schema:
        $ref: '#/components/schemas/DeviceName'
    UserInfoLocale:
      in: 'query'
      name: 'locale'
      required: true
      schema:
        $ref: '#/components/schemas/Locale'
    UserInfoLocaleOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'locale'
      required: false
      schema:
        $ref: '#/components/schemas/Locale'
    UserInfoOs:
      in: 'query'
      name: 'os'
      required: true
      schema:
        $ref: '#/components/schemas/SystemVersion'
    UserInfoOsOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'os'
      required: false
      schema:
        $ref: '#/components/schemas/SystemVersion'
    UserInfoUuid:
      in: 'query'
      name: 'uuid'
      required: true
      schema:
        $ref: '#/components/schemas/IdentifierParams'
    UserInfoUuidOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'uuid'
      required: false
      schema:
        $ref: '#/components/schemas/IdentifierParams'
    UserInfoVersion:
      in: 'query'
      name: 'version'
      required: true
      schema:
        $ref: '#/components/schemas/AppVersion'
    UserInfoVersionOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'version'
      required: false
      schema:
        $ref: '#/components/schemas/AppVersion'
  schemas:
    AppVersion:
      description: 'The bundle version, `4.5.8` in the shipped build.'
      examples:
        - '4.5.8'
      type: 'string'
    ArcadeLocation:
      description: |
        One arcade. An entry is dropped unless `ID`, `Lat`, and `Long` are numbers, `Name` and
        `Open` are strings, and `Model` is a non-empty array.
      properties:
        ID:
          type: 'integer'
        Lat:
          format: 'double'
          type: 'number'
        Long:
          format: 'double'
          type: 'number'
        Model:
          description: |
            The cabinets on site, named as the master data names them. The pin uses whichever of
            them the master data orders first, so a name absent from it draws nothing.
          items:
            type: 'string'
          type: 'array'
        Name:
          type: 'string'
        Open:
          description: 'The opening hours, as free text.'
          type: 'string'
      required:
        - 'ID'
        - 'Lat'
        - 'Long'
        - 'Model'
        - 'Name'
        - 'Open'
      type: 'object'
    ArcadeMasterResponse:
      description: |
        Master data for the arcade map. `Version` gates the whole feature: a build below it is
        refused outright, so raising it withdraws the map from older builds.
      properties:
        Info:
          description: 'The banner image above the map.'
          type: 'string'
        Mark:
          description: |
            The cabinet models, in pin precedence order. An entry whose four fields are not all
            strings is discarded, including `Order`, which is a string rather than a number.
          items:
            properties:
              Image:
                description: 'The pin image for this model.'
                type: 'string'
              Model:
                type: 'string'
              Name:
                type: 'string'
              Order:
                description: 'The precedence, as a string rather than a number.'
                type: 'string'
            type: 'object'
          type: 'array'
        Version:
          description: 'The minimum app version, compared numerically against the build version.'
          type: 'string'
      type: 'object'
    CampaignEntry:
      description: |
        One campaign giveaway. The tune it grants arrives under `music`, shaped as a catalogue
        entry; an entry without one still parses, and describes an item that is not a tune.
      properties:
        bannerUrl:
          format: 'uri'
          type: 'string'
        campaignId:
          description: 'Sent back as `campId`, which is a string in the request.'
          type: 'integer'
        copyright:
          type: 'string'
        description:
          type: 'string'
        foreignUrl:
          description: 'An external page for the campaign. Ignored when empty.'
          format: 'uri'
          type: 'string'
        hideType:
          description: 'A value of 2 hides the entry from the list entirely.'
          type: 'integer'
        itemId:
          type: 'integer'
        itemType:
          description: 'Zero is a tune. A tune is the only type with a thumbnail and a download.'
          type: 'integer'
        music:
          $ref: '#/components/schemas/MusicEntry'
        name:
          type: 'string'
        option:
          description: |
            The experience-point item this campaign duplicates. With both fields present and that
            item already granted, the entry counts as earned rather than claimable.
          properties:
            id:
              type: 'integer'
            type:
              type: 'integer'
          type: 'object'
        termsDescription:
          type: 'string'
        termsTable:
          description: |
            What the unlock waits on, read according to `unlockType`: companion applications by
            URL scheme, or pack identifiers.
          items:
            type: 'string'
          type: 'array'
        thumbnailUrl:
          description: 'Read only when `itemType` is a tune.'
          format: 'uri'
          type: 'string'
        unlockType:
          description: |
            0 unlocked outright, 1 once every companion application is installed, 2 once every
            listed pack is owned, 3 as 1 but gated behind an app update, and 4 by serial code.
          type: 'integer'
        unlocked:
          description: 'Whether the server has already granted this item to the account.'
          type: 'boolean'
      type: 'object'
    CampaignTheme:
      description: |
        The store's campaign dressing, carried on the resource manifest as `Col`. Its `Option`
        fields are the numbered slots the store reads for its colours and images.
      properties:
        Name:
          description: 'The campaign identifier the store branches on.'
          type: 'string'
        Option:
          properties:
            a01:
              description: 'The rotating message list.'
              items:
                type: 'string'
              type: 'array'
            c01:
              description: 'The store base colour.'
              type: 'string'
            c02:
              description: 'The strap image.'
              type: 'string'
            c03:
              description: 'The base image.'
              type: 'string'
            c11:
              description: 'The sample-button colour.'
              type: 'string'
            c21:
              description: 'The first pack colour.'
              type: 'string'
            c22:
              description: 'The second pack colour.'
              type: 'string'
          type: 'object'
      type: 'object'
    DeviceName:
      description: 'The hardware model identifier.'
      examples:
        - 'iPad8,11'
      type: 'string'
    ExtendNoteEntry:
      description: |
        One extend note. An entry without a `Music` sub-object is discarded, so that field is
        effectively required.
      properties:
        Comment:
          type: 'string'
        ExtID:
          description: |
            The extend-note archive identifier. These occupy their own block: every one observed is
            `100050xxx`, and the tune it belongs to is the same number 50000 lower.
          type: 'integer'
        ExtLevel:
          description: "The SPECIAL chart's difficulty rating."
          type: 'integer'
        ExtURL:
          description: 'Where the extend-note archive is downloaded from.'
          format: 'uri'
          type: 'string'
        ExtURL2:
          description: 'A second archive URL, used alongside `ExtURL`.'
          format: 'uri'
          type: 'string'
        IsNew:
          type: 'boolean'
        Music:
          $ref: '#/components/schemas/MusicEntry'
        PID:
          description: 'The product identifier, and the key notes are indexed by. Must be unique.'
          type: 'integer'
        PackID:
          type: 'integer'
        PackName:
          type: 'string'
        Price:
          description: |
            The catalogue price, as a bare integer in whatever unit the server prices in — not a
            localised currency amount. Zero means free.
          type: 'integer'
      type: 'object'
    ExtendNoteListResponse:
      description: 'One page of the extend-note catalogue.'
      properties:
        Date:
          type: 'integer'
        Error:
          type: 'string'
        HasNext:
          type: 'boolean'
        NoteList:
          items:
            $ref: '#/components/schemas/ExtendNoteEntry'
          type: 'array'
        Version:
          type: 'string'
      type: 'object'
    IdentifierParams:
      description: |
        A per-install fingerprint: the hex MD5 of the device UUID with the literal `STORE` appended,
        computed once per process. It is the closest thing the API has to an account identifier for
        an anonymous install.
      examples:
        - '098815807733da415e50fce611e5c1d8'
      pattern: '^[0-9a-f]{32}$'
      type: 'string'
    Locale:
      description: |
        The device's language crossed with the build's region, joined by an underscore — not the
        device's own locale identifier. The region half is the build constant, so it does not vary
        with the device.
      examples:
        - 'en_JP'
        - 'ja_JP'
      type: 'string'
    ManageSortEntry:
      description: |
        The sort metadata for one tune. The readings are converted to yomigana on arrival, so a
        reading in kanji or katakana is accepted.
      properties:
        a_yomi:
          description: 'The artist reading.'
          type: 'string'
        m_yomi:
          description: 'The title reading.'
          type: 'string'
        musicId:
          type: 'integer'
        pack_name:
          description: 'The pack the tune is filed under.'
          type: 'string'
      type: 'object'
    MusicEntry:
      description: 'One tune within a pack, or a tune fetched on its own.'
      properties:
        Artist:
          type: 'string'
        ArtworkURL:
          format: 'uri'
          type: 'string'
        ID:
          type: 'integer'
        ItemURL:
          description: 'Where the tune archive is downloaded from.'
          format: 'uri'
          type: 'string'
        Level:
          description: |
            The difficulty ratings. At least three entries are required before any are read; each is
            clamped, with the fourth (SPECIAL) allowed one step higher than the first three.
          items:
            type: 'integer'
          type: 'array'
        Name:
          type: 'string'
        NoteList:
          description: |
            The tune's extend notes, sent by `/v3/musicinfo/`. Each entry is registered as owned
            when it is already among the purchased notes, with the rest of this payload attached
            to it as its `Music`.
          items:
            $ref: '#/components/schemas/ExtendNoteEntry'
          type: 'array'
        PID:
          description: |
            The extend-note product identifiers available for this tune. A present, non-empty list
            is what marks a tune as having a SPECIAL chart to buy.
          items:
            type: 'integer'
          type: 'array'
        SampleURL:
          description: 'The preview clip.'
          format: 'uri'
          type: 'string'
        iTunesURL:
          format: 'uri'
          type: 'string'
      type: 'object'
    MusicListKey:
      description: |
        The install's UUID, used both to key the local purchased-content lists and as the server
        identity. Spelled the way `CFUUIDCreateString` spells one: upper case, with dashes.
      examples:
        - '00000000-0000-0000-0000-000000000000'
      type: 'string'
    NewsResponse:
      description: 'The message of the day, and the notices that go with it.'
      properties:
        Info:
          description: |
            The notices. At most one is used: the first whose `ID` is above the last one already
            seen and whose `Ver` the build has reached. Order the list accordingly.
          items:
            properties:
              ID:
                description: 'The notice identifier. A value below 1 is treated as no identifier.'
                type: 'integer'
              Image:
                description: 'The image the notice is drawn from.'
                type: 'string'
              Link:
                format: 'uri'
                type: 'string'
              Message:
                type: 'string'
              Ver:
                description: 'The minimum app version. Builds below it skip the notice.'
                type: 'string'
            type: 'object'
          type: 'array'
        UpdateText:
          description: 'The message-of-the-day lines. One is picked at random and they cycle.'
          items:
            type: 'string'
          type: 'array'
        UpdateTime:
          description: |
            When the store last changed. Compared numerically against the last time the store was
            opened; a later value marks the store as having something new.
          type: 'string'
      type: 'object'
    PackEntry:
      description: |
        One music pack. It carries no price: a captured `/v3/packlist/` page held `ID`, `Name`,
        `Comment`, `ShortComment`, `IsNew`, `Copyright`, `ArtworkURL`, `ExtNum`, and `MusicNum`,
        and nothing resembling an amount. A pack is priced through its StoreKit product instead.

        That capture also shows what a list page omits: no `MusicList`, `ArtistURL`, or
        `ArtistBunnerURL`, which belong to `/v3/packinfo/`, with the tune count advertised through
        `MusicNum` alone. All three are described here because either response may carry them.
      properties:
        ArtistBunnerURL:
          description: 'The artist banner, spelled as the server spells it.'
          format: 'uri'
          type: 'string'
        ArtistURL:
          format: 'uri'
          type: 'string'
        ArtworkURL:
          format: 'uri'
          type: 'string'
        Comment:
          type: 'string'
        Copyright:
          type: 'string'
        ExtNum:
          description: |
            How many extend notes the pack advertises. A non-zero value is what draws the Sequences
            badge on the pack row.
          type: 'integer'
        ID:
          type: 'integer'
        IsNew:
          type: 'boolean'
        MusicList:
          description: |
            Sent by `/v3/packinfo/`, not by a list page. Only the first four entries are kept.
          items:
            $ref: '#/components/schemas/MusicEntry'
          type: 'array'
        MusicNum:
          description: |
            How many tunes the pack holds. Ignored — the count comes from `MusicList`, which a
            list page does not carry. Recorded here because the shipped server sends it.
          type: 'integer'
        Name:
          type: 'string'
        ShortComment:
          type: 'string'
      type: 'object'
    PackListResponse:
      description: |
        One page of the pack catalogue. An empty `PackList` with no `Error` beside it counts as a
        fault, so send `Error` whenever there is nothing to return.
      properties:
        Date:
          description: |
            The current month. Advancing it resets the accumulated purchase total for the limit.
          type: 'integer'
        Error:
          description: 'A message to surface in place of the listing.'
          type: 'string'
        Genre:
          description: |
            Exactly two parallel arrays: the genre identifiers, then the genre names. A payload of
            any other length is ignored, and names are consumed only up to the shorter of the two.
          items:
            type: 'array'
          type: 'array'
        HasNext:
          description: 'Whether a further page exists.'
          type: 'boolean'
        PackList:
          items:
            $ref: '#/components/schemas/PackEntry'
          type: 'array'
        Promotion:
          description: 'Promotional payload.'
          type: 'object'
        Version:
          description: |
            The minimum app version served. Compared numerically against the build version; an
            older build stops here rather than reading the page.
          type: 'string'
      type: 'object'
    ReceiptVerification:
      description: |
        The verdict on an App Store receipt. Three things must line up before a purchase is
        credited: `status` is zero, `Products` is present and non-empty, and the `RB-RES-SIG-V2`
        response header matches a digest over the body and the nonce the request carried. The body
        alone grants nothing, so the header is mandatory.
      properties:
        MsgDev:
          description: 'A developer-facing message. Parsed and then discarded.'
          type: 'string'
        Products:
          description: 'The product identifiers the receipt was accepted for.'
          items:
            type: 'string'
          type: 'array'
        error:
          description: 'Parsed and then discarded. Lower case here, unlike `Error` elsewhere.'
          type: 'string'
        status:
          description: 'Zero is a pass. Any other value fails the purchase.'
          examples:
            - 0
          type: 'integer'
      type: 'object'
    RegionCode:
      default: 'JP'
      description: |
        The region code, fixed at build time. `JP` is the only value the shipped build sends, and
        it is what the server answers Japanese in.
      examples:
        - 'JP'
      type: 'string'
    ResourceManifest:
      description: |
        Where the downloadable assets live, and the credentials for later requests. The same body
        serves start-up and the asset download, which is why it carries both the asset fields and
        the account ones.
      properties:
        App:
          description: |
            The minimum app version. A build below it is sent to the App Store instead of into
            the game, so this field can force an update.
          type: 'string'
        Col:
          $ref: '#/components/schemas/CampaignTheme'
        ItemURL:
          description: 'Where the asset archive is downloaded from.'
          format: 'uri'
          type: 'string'
        Passwd:
          description: |
            The account password, sent back as `passwd` on later requests. Send it with `UserID`
            or not at all: a body carrying one without the other is refused as a network error.
          type: 'string'
        Time:
          description: 'The server clock, kept for the duration of the download.'
          type: 'string'
        Type:
          description: |
            Whether the update is mandatory, as a decimal string. Absent counts as `0`.
          type: 'string'
        UserID:
          description: 'The account identifier, sent back as `user_id` on later requests.'
          type: 'string'
        Version:
          description: 'The asset-archive version. Changing it is what triggers a download.'
          type: 'string'
        terms_version:
          description: |
            The terms version in force, compared against the version already accepted. The only
            lower-case key in the payload.
          type: 'string'
      type: 'object'
    ServerError:
      description: |
        The failure envelope. Any endpoint can answer `200 OK` and still have failed: the status
        says the request was received, and this body is what says it was refused. A response
        carrying `Error` carries none of the documented payload.
      properties:
        Error:
          description: 'The failure message, in the language the region serves.'
          examples:
            - 'Connection failed'
            - '接続に失敗しました。'
          type: 'string'
      type: 'object'
    StartupResponse:
      description: |
        The start-up payload: where the in-app information pages live, and when they last changed.
        Credentials are not part of it — those come with the resource manifest. A live response
        carried the four fields below, three of which are consumed.
      properties:
        AnotherURL:
          description: |
            The page that replaces `URL` once the information has been read. Served over plaintext
            HTTP, as `URL` is.
          examples:
            - 'http://akx.konaminet.jp/akx/main/news/passed_info.jsp'
          format: 'uri'
          type: 'string'
        SvTime:
          description: 'The server clock as `YYYYMMDDhhmmss`. Sent, but not consumed.'
          examples:
            - '20260828045853'
          type: 'string'
        URL:
          description: 'The information page linked from the title screen.'
          examples:
            - 'http://akx.konaminet.jp/akx/main/news/info.jsp'
          format: 'uri'
          type: 'string'
        UpdateTime:
          description: |
            When the information page last changed, parsed as `YYYYMMddHHmm`. A value later than
            the last read marks the page as unread. A value that does not parse falls back to
            `200001010000`.
          examples:
            - '201911291440'
          type: 'string'
      type: 'object'
    SystemVersion:
      description: 'The iOS version string.'
      examples:
        - '17.7.11'
      type: 'string'
    TermEntry:
      description: 'One terms document.'
      properties:
        contents:
          description: 'The document body, when inlined.'
          type: 'string'
        title:
          type: 'string'
        type:
          $ref: '#/components/schemas/TermType'
        url:
          description: 'Where the document is shown from, when it is not inlined.'
          format: 'uri'
          type: 'string'
      type: 'object'
    TermType:
      description: |
        Which terms document. Type 1 is the one the title screen gates on; with no entry of that
        type in the listing, neither branch of the check runs and nothing is presented.
      examples:
        - 1
      type: 'integer'
    UnimplementedPlayLogRequest:
      description: |
        The body of the version 1 play log. It has no endpoint and is never sent; `/log/play/`
        supersedes it. Documented only because the body-building code survives.
      properties:
        dif:
          type: 'integer'
        music:
          type: 'integer'
        target:
          $ref: '#/components/schemas/RegionCode'
        uuid:
          $ref: '#/components/schemas/MusicListKey'
      type: 'object'
    UnimplementedRewardCheckRequest:
      description: |
        The body of the reward check. It has no endpoint and is never sent. Documented only
        because the body-building code survives.
      properties:
        appliId:
          description: 'The Applilink application identifiers already seen.'
          items:
            type: 'string'
          type: 'array'
        nonce:
          type: 'string'
        passwd:
          type: 'string'
        rewardId:
          type: 'string'
        userId:
          type: 'string'
      type: 'object'
    UnlockCatalogue:
      description: |
        What can be unlocked with points, for the theme named in the request. Each theme keeps its
        own catalogue, so the two never mix.
      properties:
        Package:
          description: 'The groups, ordered by `Order`, highest first.'
          items:
            $ref: '#/components/schemas/UnlockPackage'
          type: 'array'
        RewardBannerList:
          description: |
            Used on the Limelight theme only, and only the first entry. Serve the base name in
            `URL`: `@2x` is appended before the extension on a retina device, and stripped
            otherwise, so both variants have to exist.
          items:
            properties:
              ID:
                type: 'integer'
              URL:
                format: 'uri'
                type: 'string'
            type: 'object'
          type: 'array'
        Version:
          type: 'string'
      type: 'object'
    UnlockPackage:
      description: 'One group of unlockable items.'
      properties:
        Data:
          description: 'The items, ordered by `Point`, highest first.'
          items:
            $ref: '#/components/schemas/UnlockPackageItem'
          type: 'array'
        ID:
          type: 'integer'
        Order:
          type: 'integer'
        Title:
          type: 'string'
      type: 'object'
    UnlockPackageItem:
      description: 'One unlockable item.'
      properties:
        ID:
          type: 'integer'
        Name:
          type: 'string'
        Path:
          description: 'Where the item is downloaded from.'
          type: 'string'
        Point:
          description: 'What it costs, in points.'
          type: 'integer'
        Type:
          description: 'Which kind of item it is, and so where it lands once unlocked.'
          type: 'integer'
      type: 'object'
info:
  description: REFLEC BEAT plus API.
  license:
    name: 'MIT'
    url: 'https://github.com/Tatsh/expert-xylophone/blob/master/LICENSE.txt'
  summary: 'The HTTP API that REFLEC BEAT plus 4.5.8 (jp.konami.rbplus) uses.'
  title: 'REFLEC BEAT plus server API'
  version: '4.5.8'
openapi: '3.1.0'
paths:
  /campaign/fetch/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                campId:
                  description: 'The campaign identifier, as a decimal string.'
                  type: 'string'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'campId'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      Error:
                        description: 'The message to surface when `Status` is not zero.'
                        type: 'string'
                      Status:
                        description: 'Zero releases the item. Anything else surfaces as an error.'
                        examples:
                          - 0
                        type: 'integer'
                      URL:
                        description: |
                          Where the item is fetched from. For a tune the value is not used
                          directly: its presence is what leads on to `/v3/musicinfo/`.
                        format: 'uri'
                        type: 'string'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The campaign item.'
      summary: 'Fetch one campaign item, including its download URL.'
      tags:
        - 'campaign'
  /campaign/list/:
    post:
      description: |
        Note that `head` arrives as a quoted string while `limit` arrives as a bare number. The
        inconsistency is in the hand-built JSON, and it is what reaches the server.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                head:
                  description: 'The index of the first campaign to return, as a decimal string.'
                  type: 'string'
                limit:
                  description: 'The maximum number of campaigns to return.'
                  type: 'integer'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'head'
                - 'limit'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      Error:
                        description: |
                          Surfaced when `List` is empty. An empty list with no message here is
                          reported as a connection failure instead.
                        type: 'string'
                      List:
                        items:
                          $ref: '#/components/schemas/CampaignEntry'
                        type: 'array'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of campaigns.'
      summary: 'List campaigns, one page at a time.'
      tags:
        - 'campaign'
  /campaign/verify/:
    post:
      description: 'The code is typed by the user into a text field.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                campId:
                  description: 'The campaign identifier, as a decimal string.'
                  type: 'string'
                code:
                  description: 'The serial code as typed.'
                  type: 'string'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'campId'
                - 'code'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      Error:
                        description: 'The message to surface when `Status` is not zero.'
                        type: 'string'
                      Status:
                        description: |
                          Zero grants the campaign item and leads on to fetching it. Anything else
                          surfaces as an error.
                        examples:
                          - 0
                        type: 'integer'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The redemption result.'
      summary: 'Redeem a campaign serial code.'
      tags:
        - 'campaign'
  /gamecenter/:
    post:
      description: |
        The body is a hand-formatted form-urlencoded string, six decimal places per field, with no
        explicit content type on the request. The range is a fixed 0.27 degrees rather than
        anything derived from the visible map span.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                lat:
                  description: 'The centre latitude of the visible map region.'
                  examples:
                    - 35.681236
                  format: 'double'
                  type: 'number'
                long:
                  description: 'The centre longitude of the visible map region.'
                  examples:
                    - 139.767125
                  format: 'double'
                  type: 'number'
                range:
                  default: 0.27
                  description: 'The search radius in degrees. Always 0.27.'
                  format: 'double'
                  type: 'number'
              required:
                - 'lat'
                - 'long'
                - 'range'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      GameCenterList:
                        items:
                          $ref: '#/components/schemas/ArcadeLocation'
                        type: 'array'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The matching locations.'
      summary: 'List arcade locations within a map region.'
      tags:
        - 'social'
  /log/play/:
    post:
      description: |
        Not sent at all for tune identifiers below the minimum, which excludes the tutorial and
        preview tunes: those plays never reach the server.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                device:
                  $ref: '#/components/schemas/DeviceName'
                difficulty:
                  description: 'The chart played: BASIC, MEDIUM, HARD, or SPECIAL.'
                  type: 'integer'
                jr:
                  description: |
                    A judgement-related counter, passed through from the result without further
                    interpretation, so its exact meaning is not recoverable.
                  type: 'integer'
                locale:
                  $ref: '#/components/schemas/Locale'
                music_id:
                  type: 'integer'
                note:
                  description: 'The extend-note identifier when a SPECIAL chart was played.'
                  type: 'integer'
                os:
                  $ref: '#/components/schemas/SystemVersion'
                score:
                  type: 'integer'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/IdentifierParams'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'device'
                - 'difficulty'
                - 'jr'
                - 'locale'
                - 'music_id'
                - 'note'
                - 'os'
                - 'score'
                - 'target'
                - 'user_id'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            Logged. No field of a success body is consumed, so `{}` will do; a failure carries
            `Error`.
      summary: 'Log a completed play.'
      tags:
        - 'telemetry'
  /manage_sort/:
    get:
      description: 'The region code is the only input.'
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - additionalProperties:
                      $ref: '#/components/schemas/ManageSortEntry'
                    description: |
                      Keyed by tune identifier as a string. A tune with no entry here is filed
                      with empty readings and listed as missing.
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The sort data.'
      summary: 'Fetch the sort order for the manage tab.'
      tags:
        - 'store'
  /new2/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NewsResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The message.'
      summary: 'Fetch the in-app message of the day.'
      tags:
        - 'social'
  /push/token/:
    post:
      description: |
        The three fields are named positionally, which is all that is known about them.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                p1:
                  description: 'The stored user identifier.'
                  type: 'string'
                p2:
                  description: 'The stored token or password.'
                  type: 'string'
                p3:
                  description: 'The APNs device token.'
                  type: 'string'
                target:
                  allOf:
                    - $ref: '#/components/schemas/RegionCode'
                  description: |
                    Optional, and never sent by the app, but accepted: it selects the language of
                    the reply. With `JP`, an `Error` comes back in Japanese rather than English.
              required:
                - 'p1'
                - 'p2'
                - 'p3'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            The registration result. A 200 does not mean the token was registered: the status is
            200 either way, and `Error` in the body is what says it was not. No field of a success
            body is consumed, so `{}` will do.
      summary: 'Register the APNs device token.'
      tags:
        - 'session'
  /search_master/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ArcadeMasterResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The master data.'
      summary: 'Fetch the arcade-location master data.'
      tags:
        - 'social'
  /startup/:
    get:
      description: |
        The first call of a session, and the only endpoint whose query is the region code alone.
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/StartupResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The start-up payload.'
      summary: 'Fetch the start-up payload.'
      tags:
        - 'session'
  /tutorial/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                types:
                  description: |
                    The identifiers of the walkthroughs that have been seen: 23 (music select),
                    24 (customize, on entry), 25 (the settings button), 29 (unlock), and
                    34 (customize, on completion).
                  examples:
                    - [23, 24, 34]
                  items:
                    type: 'integer'
                  type: 'array'
                user:
                  description: |
                    The account identifier issued with the resource manifest. A fresh install has
                    none and sends an empty string.
                  examples:
                    - ''
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
              required:
                - 'types'
                - 'user'
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            Recorded. No field of a success body is consumed, so `{}` will do; a failure carries
            `Error`.
      summary: 'Report which first-run walkthroughs have been completed.'
      tags:
        - 'session'
  /unlock/:
    get:
      description: |
        The only endpoint that takes the selected theme, and one of the few with no client-info
        parameters.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: |
            The selected theme: one of the three play-field themes, Classic, Colette, or
            Limelight. Each keeps a separate catalogue.
          in: 'query'
          name: 'thema'
          required: true
          schema:
            type: 'integer'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UnlockCatalogue'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The unlock listing.'
      summary: 'List the unlockable items for a theme.'
      tags:
        - 'telemetry'
  /unlocked/:
    post:
      description: |
        The one endpoint whose body is form-urlencoded rather than JSON, and it arrives with no
        explicit content type.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                id:
                  description: "The unlocked item's identifier within its category."
                  type: 'integer'
                target:
                  $ref: '#/components/schemas/RegionCode'
                tp:
                  description: 'The point total associated with the unlock.'
                  format: 'float'
                  type: 'number'
                type:
                  description: "The unlocked item's category."
                  type: 'integer'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
              required:
                - 'id'
                - 'target'
                - 'tp'
                - 'type'
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            Recorded. No field of a success body is consumed, so `{}` will do; a failure carries
            `Error`.
      summary: 'Report that an item has been unlocked.'
      tags:
        - 'telemetry'
  /unlockmusic/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The tune identifier being unlocked.'
          in: 'query'
          name: 'music'
          required: true
          schema:
            type: 'integer'
        - description: 'A per-request random key. The response must echo it back as `Key`.'
          in: 'query'
          name: 'key'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/MusicEntry'
                      - properties:
                          Key:
                            description: |
                              The `key` the request sent, echoed back. The tune is accepted only
                              when this matches; anything else is treated as a network error, so
                              the payload is a catalogue entry with this one field added.
                            type: 'integer'
                        type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The unlock result.'
      summary: 'Claim a tune unlock.'
      tags:
        - 'telemetry'
  /v3/age/:
    post:
      description: |
        Arrives with no explicit content type. `type` is the purchase-limit bracket, sent as a
        decimal string rather than a number.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                app_ver:
                  $ref: '#/components/schemas/AppVersion'
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  description: |
                    The declared bracket, as a decimal string: `0` is undeclared, `1` and `2` are
                    monthly ceilings of 5000 and 20000 yen, and anything higher means no ceiling.
                  examples:
                    - '2'
                  type: 'string'
                user_id:
                  description: |
                    The account identifier issued with the resource manifest. A fresh install has
                    none and sends an empty string.
                  examples:
                    - ''
                  type: 'string'
              required:
                - 'app_ver'
                - 'target'
                - 'type'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      status:
                        description: |
                          Zero lets the purchase go ahead. Every other value, and a missing
                          `status`, stops it.
                        examples:
                          - 0
                        type: 'integer'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The verification result, unless the body carries `Error`.'
      summary: "Report the user's declared purchase-limit bracket."
      tags:
        - 'store'
  /v3/extmusicinfo/:
    get:
      description: |
        As with `packinfo`, the client-info parameters are present only on a user-initiated
        request.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The extend-note product identifier (the `PID` of a list entry).'
          in: 'query'
          name: 'extitem'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuidOptional'
        - $ref: '#/components/parameters/UserInfoVersionOptional'
        - $ref: '#/components/parameters/UserInfoDeviceOptional'
        - $ref: '#/components/parameters/UserInfoOsOptional'
        - $ref: '#/components/parameters/UserInfoLocaleOptional'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ExtendNoteEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The extend note.'
      summary: 'Fetch one extend note.'
      tags:
        - 'store'
  /v3/extmusiclist/:
    get:
      description: |
        An extend note is an extra SPECIAL chart for a tune that already exists. Unlike a pack, an
        extend note does carry a catalogue `Price`.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The index of the first note to return.'
          in: 'query'
          name: 'head'
          required: true
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'The maximum number of notes to return.'
          in: 'query'
          name: 'limit'
          required: true
          schema:
            default: 10
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ExtendNoteListResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of the extend-note catalogue.'
      summary: 'List purchasable extend notes (the Sequences tab), one page at a time.'
      tags:
        - 'store'
  /v3/musicinfo/:
    get:
      description: |
        Used by the manage tab to re-resolve a tune's download URL, and by the campaign screen for
        a giveaway item.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The tune identifier.'
          in: 'query'
          name: 'music'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MusicEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The tune entry.'
      summary: "Fetch one tune's catalogue entry."
      tags:
        - 'store'
  /v3/packinfo/:
    get:
      description: |
        The client-info parameters are present only when the request originates from a user
        action; a background refresh sends `target` and `pack` alone.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The pack identifier.'
          in: 'query'
          name: 'pack'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuidOptional'
        - $ref: '#/components/parameters/UserInfoVersionOptional'
        - $ref: '#/components/parameters/UserInfoDeviceOptional'
        - $ref: '#/components/parameters/UserInfoOsOptional'
        - $ref: '#/components/parameters/UserInfoLocaleOptional'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PackEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The pack.'
      summary: 'Fetch one pack, including its tune list.'
      tags:
        - 'store'
  /v3/packlist/:
    get:
      description: |
        Paged with `head` as the count already fetched plus one, and `limit` fixed at 10.

        No pack entry carries a price, confirmed against the live endpoint. A pack is priced
        entirely through its StoreKit product, so there is nothing here to fall back to when no
        App Store record exists.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The one-based index of the first pack to return.'
          in: 'query'
          name: 'head'
          required: true
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'The maximum number of packs to return. Always 10.'
          in: 'query'
          name: 'limit'
          required: true
          schema:
            default: 10
            type: 'integer'
        - description: 'The genre to list, or the default genre identifier.'
          in: 'query'
          name: 'genre'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PackListResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of the pack catalogue.'
      summary: 'List purchasable music packs, one page at a time.'
      tags:
        - 'store'
  /v3/ssl_resource/:
    post:
      description: |
        Drives the first-run asset download, which is required — the game will not run without it.
        Sent with no explicit content type. On a fresh install, before any credentials exist,
        `user_id` and `passwd` are sent as empty strings rather than omitted.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                passwd:
                  description: 'The stored password, or an empty string on a fresh install.'
                  examples:
                    - ''
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  description: 'The stored user identifier, or an empty string on a fresh install.'
                  examples:
                    - ''
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'passwd'
                - 'target'
                - 'user_id'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ResourceManifest'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The resource manifest.'
      summary: 'Fetch the downloadable resource manifest.'
      tags:
        - 'session'
  /v3/terms/fetch/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  $ref: '#/components/schemas/TermType'
              required:
                - 'target'
                - 'type'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TermEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The document.'
      summary: 'Fetch one terms document.'
      tags:
        - 'terms'
  /v3/terms/list/:
    post:
      description: |
        The title screen calls this before letting the first tap through, so an unreachable
        endpoint here blocks the title screen entirely.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
              required:
                - 'target'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      list:
                        items:
                          $ref: '#/components/schemas/TermEntry'
                        type: 'array'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            The terms listing. A response without a `list` key is treated as a network error.
      summary: 'List the terms documents in force.'
      tags:
        - 'terms'
  /v3/terms/log/:
    post:
      description: |
        Acceptance is only recorded locally once this call returns OK, so with the endpoint
        unavailable the terms screen cannot be cleared.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  $ref: '#/components/schemas/TermType'
                user_id:
                  description: 'The stored user identifier.'
                  type: 'string'
                version:
                  description: 'The terms version being agreed to, as `terms_version` served it.'
                  type: 'string'
              required:
                - 'target'
                - 'type'
                - 'user_id'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            Acceptance recorded, which is what clears the terms screen. No field of a success body
            is consumed, so `{}` will do; a failure carries `Error`.
      summary: 'Record acceptance of a terms document.'
      tags:
        - 'terms'
  /v3/verify_receipt/:
    post:
      description: |
        The body is assembled as a string rather than serialised from a dictionary. The nonce is
        62-character alphanumeric and generated per request; the response must sign over it.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                device:
                  $ref: '#/components/schemas/DeviceName'
                locale:
                  $ref: '#/components/schemas/Locale'
                nonce:
                  description: 'A per-request alphanumeric nonce.'
                  type: 'string'
                os:
                  $ref: '#/components/schemas/SystemVersion'
                passwd:
                  type: 'string'
                products:
                  description: 'The StoreKit product identifiers being verified.'
                  items:
                    type: 'string'
                  type: 'array'
                receiptdata:
                  description: 'The base64-encoded App Store receipt.'
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userid:
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/IdentifierParams'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'device'
                - 'locale'
                - 'nonce'
                - 'os'
                - 'passwd'
                - 'products'
                - 'receiptdata'
                - 'target'
                - 'userid'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ReceiptVerification'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The verification result.'
          headers:
            RB-RES-SIG-V2:
              description: |
                A digest over the response body and the nonce the request carried. A purchase is
                credited only when this matches the digest computed from the same two inputs, so
                the header is required for the receipt to be accepted at all.
              schema:
                type: 'string'
      summary: 'Verify an App Store receipt and credit the purchase.'
      tags:
        - 'store'
servers:
  - description: |
      The shipped endpoint. All three parts are build-time options (`API_SCHEME`, `API_HOST`,
      `API_BASE_PATH`), so a private or replacement server can be substituted.
    url: '{scheme}://{host}{basePath}'
    variables:
      basePath:
        default: '/akx/main/cgi/'
        description: 'The `API_BASE_PATH` build option. Every path below is relative to it.'
      host:
        default: 'akx.s.konaminet.jp'
        description: 'The `API_HOST` build option.'
      scheme:
        default: 'https'
        description: 'The `API_SCHEME` build option. Plaintext is only useful for a test server.'
        enum:
          - 'http'
          - 'https'
tags:
  - description: 'Start-up, resources, and device registration.'
    name: 'session'
  - description: 'The in-app catalogue: packs, extend notes, tunes, and purchases.'
    name: 'store'
  - description: 'Terms of service listing, fetching, and acceptance.'
    name: 'terms'
  - description: 'Serial-code campaigns and their giveaway items.'
    name: 'campaign'
  - description: 'Play logs and unlock reporting.'
    name: 'telemetry'
  - description: 'Arcade location search and message-of-the-day.'
    name: 'social'
