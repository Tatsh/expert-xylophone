components:
  parameters:
    Target:
      description: 'The region code. Every endpoint takes it.'
      in: 'query'
      name: 'target'
      required: true
      schema:
        $ref: '#/components/schemas/RegionCode'
    UserInfoDevice:
      in: 'query'
      name: 'device'
      required: true
      schema:
        $ref: '#/components/schemas/DeviceName'
    UserInfoDeviceOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'device'
      required: false
      schema:
        $ref: '#/components/schemas/DeviceName'
    UserInfoLocale:
      in: 'query'
      name: 'locale'
      required: true
      schema:
        $ref: '#/components/schemas/Locale'
    UserInfoLocaleOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'locale'
      required: false
      schema:
        $ref: '#/components/schemas/Locale'
    UserInfoOs:
      in: 'query'
      name: 'os'
      required: true
      schema:
        $ref: '#/components/schemas/SystemVersion'
    UserInfoOsOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'os'
      required: false
      schema:
        $ref: '#/components/schemas/SystemVersion'
    UserInfoUuid:
      in: 'query'
      name: 'uuid'
      required: true
      schema:
        $ref: '#/components/schemas/IdentifierParams'
    UserInfoUuidOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'uuid'
      required: false
      schema:
        $ref: '#/components/schemas/IdentifierParams'
    UserInfoVersion:
      in: 'query'
      name: 'version'
      required: true
      schema:
        $ref: '#/components/schemas/AppVersion'
    UserInfoVersionOptional:
      description: 'Sent only for a user-initiated request.'
      in: 'query'
      name: 'version'
      required: false
      schema:
        $ref: '#/components/schemas/AppVersion'
  schemas:
    AppVersion:
      description: 'The bundle version, `4.5.8` in the shipped build.'
      examples:
        - '4.5.8'
      type: 'string'
    DeviceName:
      description: 'The hardware model identifier.'
      examples:
        - 'iPad8,11'
      type: 'string'
    ExtendNoteEntry:
      description: |
        One extend note. An entry without a `Music` sub-object is skipped by the client, so that
        field is effectively required.
      properties:
        Comment:
          type: 'string'
        ExtID:
          description: |
            The extend-note archive identifier. These occupy their own block: every one observed is
            `100050xxx`, and the tune it belongs to is the same number 50000 lower.
          type: 'integer'
        ExtLevel:
          description: "The SPECIAL chart's difficulty rating."
          type: 'integer'
        ExtURL:
          description: 'Where the extend-note archive is downloaded from.'
          format: 'uri'
          type: 'string'
        ExtURL2:
          description: 'A second archive URL, used alongside `ExtURL`.'
          format: 'uri'
          type: 'string'
        IsNew:
          type: 'boolean'
        Music:
          $ref: '#/components/schemas/MusicEntry'
        PID:
          description: 'The product identifier, and the key the client indexes notes by.'
          type: 'integer'
        PackID:
          type: 'integer'
        PackName:
          type: 'string'
        Price:
          description: |
            The catalogue price, as a bare integer in whatever unit the server prices in — not a
            localised currency amount. Zero means free.
          type: 'integer'
      type: 'object'
    ExtendNoteListResponse:
      description: 'One page of the extend-note catalogue.'
      properties:
        Date:
          type: 'integer'
        Error:
          type: 'string'
        HasNext:
          type: 'boolean'
        NoteList:
          items:
            $ref: '#/components/schemas/ExtendNoteEntry'
          type: 'array'
        Version:
          type: 'string'
      type: 'object'
    IdentifierParams:
      description: |
        A per-install fingerprint: the hex MD5 of the device UUID with the literal `STORE` appended,
        computed once per process. It is the closest thing the API has to an account identifier for
        an anonymous install.
      examples:
        - '098815807733da415e50fce611e5c1d8'
      pattern: '^[0-9a-f]{32}$'
      type: 'string'
    Locale:
      description: |
        The device's language crossed with the build's region, joined by an underscore — not the
        device's own locale identifier. The region half is the build constant, so it does not vary
        with the device.
      examples:
        - 'en_JP'
        - 'ja_JP'
      type: 'string'
    MusicEntry:
      description: 'One tune within a pack, or a tune fetched on its own.'
      properties:
        Artist:
          type: 'string'
        ArtworkURL:
          format: 'uri'
          type: 'string'
        ID:
          type: 'integer'
        ItemURL:
          description: 'Where the tune archive is downloaded from.'
          format: 'uri'
          type: 'string'
        Level:
          description: |
            The difficulty ratings. At least three entries are required before any are read; each is
            clamped, with the fourth (SPECIAL) allowed one step higher than the first three.
          items:
            type: 'integer'
          type: 'array'
        Name:
          type: 'string'
        PID:
          description: |
            The extend-note product identifiers available for this tune. A present, non-empty list
            is what marks a tune as having a SPECIAL chart to buy.
          items:
            type: 'integer'
          type: 'array'
        SampleURL:
          description: 'The preview clip.'
          format: 'uri'
          type: 'string'
        iTunesURL:
          format: 'uri'
          type: 'string'
      type: 'object'
    MusicListKey:
      description: |
        The install's UUID, used both to key the local purchased-content lists and as the server
        identity. Spelled the way `CFUUIDCreateString` spells one: upper case, with dashes.
      examples:
        - '00000000-0000-0000-0000-000000000000'
      type: 'string'
    PackEntry:
      description: |
        One music pack. No price, and this is now confirmed against the live endpoint rather than
        inferred from the client: a captured `/v3/packlist/` page carried `ID`, `Name`, `Comment`,
        `ShortComment`, `IsNew`, `Copyright`, `ArtworkURL`, `ExtNum`, and `MusicNum`, and nothing
        resembling an amount.

        That capture also shows which fields a list page omits. It carried no `MusicList`,
        `ArtistURL`, or `ArtistBunnerURL`, so those reach the client from `/v3/packinfo/` instead;
        a list page advertises its tune count through `MusicNum` alone. All three are still
        described here because the client reads them from either response.
      properties:
        ArtistBunnerURL:
          description: 'The artist banner, spelled as the server spells it.'
          format: 'uri'
          type: 'string'
        ArtistURL:
          format: 'uri'
          type: 'string'
        ArtworkURL:
          format: 'uri'
          type: 'string'
        Comment:
          type: 'string'
        Copyright:
          type: 'string'
        ExtNum:
          description: |
            How many extend notes the pack advertises. A non-zero value is what draws the Sequences
            badge on the pack row.
          type: 'integer'
        ID:
          type: 'integer'
        IsNew:
          type: 'boolean'
        MusicList:
          description: |
            Sent by `/v3/packinfo/`, not by a list page. The client keeps at most the first four
            entries.
          items:
            $ref: '#/components/schemas/MusicEntry'
          type: 'array'
        MusicNum:
          description: |
            How many tunes the pack holds. The client never reads this: it counts `MusicList`
            instead, and a list page does not carry one. Recorded because the server sends it.
          type: 'integer'
        Name:
          type: 'string'
        ShortComment:
          type: 'string'
      type: 'object'
    PackListResponse:
      description: |
        One page of the pack catalogue. The client treats an empty `PackList` with no `Error` as a
        server fault and shows its generic failure message.
      properties:
        Date:
          description: |
            The current month. The client resets its accumulated purchase total when this advances.
          type: 'integer'
        Error:
          description: 'A server-supplied message, shown to the user in place of the listing.'
          type: 'string'
        Genre:
          description: |
            Exactly two parallel arrays: the genre identifiers, then the genre names. A payload of
            any other length is ignored, and names are consumed only up to the shorter of the two.
          items:
            type: 'array'
          type: 'array'
        HasNext:
          description: 'Whether a further page exists.'
          type: 'boolean'
        PackList:
          items:
            $ref: '#/components/schemas/PackEntry'
          type: 'array'
        Promotion:
          description: 'Promotional payload.'
          type: 'object'
        Version:
          description: |
            The minimum app version the server will serve. The client compares its own bundle
            version numerically and refuses to go further if it is older.
          type: 'string'
      type: 'object'
    RegionCode:
      default: 'JP'
      description: |
        The region code, fixed at build time. `JP` is the only value the shipped build sends, and
        it is what the server answers Japanese in.
      examples:
        - 'JP'
      type: 'string'
    ServerError:
      description: |
        The failure envelope. Any endpoint can answer `200 OK` and still have failed: the status
        says the request was received, and this body is what says it was refused. A response
        carrying `Error` carries none of the documented payload.
      properties:
        Error:
          description: 'The failure message, in the language the region serves.'
          examples:
            - 'Connection failed'
            - '接続に失敗しました。'
          type: 'string'
      type: 'object'
    StartupResponse:
      description: |
        The start-up payload. These four fields were seen on a live response; the client keeps the
        whole payload and takes the identifier and password it sends to later endpoints from it, so
        a response to a registered install carries more than this.
      properties:
        AnotherURL:
          description: 'The secondary news page. Served over plaintext HTTP, as `URL` is.'
          examples:
            - 'http://akx.konaminet.jp/akx/main/news/passed_info.jsp'
          format: 'uri'
          type: 'string'
        SvTime:
          description: 'The server clock as `YYYYMMDDhhmmss`.'
          examples:
            - '20260828045853'
          type: 'string'
        URL:
          description: 'The news page the app links to.'
          examples:
            - 'http://akx.konaminet.jp/akx/main/news/info.jsp'
          format: 'uri'
          type: 'string'
        UpdateTime:
          description: 'When the news pages last changed, as `YYYYMMDDhhmm`.'
          examples:
            - '201911291440'
          type: 'string'
      type: 'object'
    SystemVersion:
      description: 'The iOS version string.'
      examples:
        - '17.7.11'
      type: 'string'
    TermEntry:
      description: 'One terms document.'
      properties:
        contents:
          description: 'The document body, when inlined.'
          type: 'string'
        title:
          type: 'string'
        type:
          $ref: '#/components/schemas/TermType'
        url:
          description: 'Where the document is shown from, when it is not inlined.'
          format: 'uri'
          type: 'string'
      type: 'object'
    TermType:
      description: |
        Which terms document. The title screen looks for type 1 specifically, and runs neither
        branch of its check when no entry of that type is present.
      examples:
        - 1
      type: 'integer'
    UnimplementedPlayLogRequest:
      description: |
        The body the client assembles for the version 1 play log. It has no endpoint, so the
        request is never sent; the version 2 endpoint at `/log/play/` supersedes it. Documented
        only because the body-building code survives in the client.
      properties:
        dif:
          type: 'integer'
        music:
          type: 'integer'
        target:
          $ref: '#/components/schemas/RegionCode'
        uuid:
          $ref: '#/components/schemas/MusicListKey'
      type: 'object'
    UnimplementedRewardCheckRequest:
      description: |
        The body the reward screen assembles. It has no endpoint, so the request is never sent.
        Documented only because the body-building code survives in the client.
      properties:
        appliId:
          description: 'The Applilink application identifiers already seen.'
          items:
            type: 'string'
          type: 'array'
        nonce:
          type: 'string'
        passwd:
          type: 'string'
        rewardId:
          type: 'string'
        userId:
          type: 'string'
      type: 'object'
info:
  description: REFLEC BEAT plus API.
  license:
    name: 'MIT'
    url: 'https://github.com/Tatsh/expert-xylophone/blob/master/LICENSE.txt'
  summary: 'The HTTP API that REFLEC BEAT plus 4.5.8 (jp.konami.rbplus) uses.'
  title: 'REFLEC BEAT plus server API'
  version: '4.5.8'
openapi: '3.1.0'
paths:
  /campaign/fetch/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                campId:
                  description: 'The campaign identifier, as a decimal string.'
                  type: 'string'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'campId'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The campaign item.'
      summary: 'Fetch one campaign item, including its download URL.'
      tags:
        - 'campaign'
  /campaign/list/:
    post:
      description: |
        Note that `head` is sent as a quoted string while `limit` is sent as a bare number — an
        inconsistency in the client's hand-built JSON, reproduced here because it is what the server
        receives.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                head:
                  description: 'The index of the first campaign to return, as a decimal string.'
                  type: 'string'
                limit:
                  description: 'The maximum number of campaigns to return.'
                  type: 'integer'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'head'
                - 'limit'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of campaigns.'
      summary: 'List campaigns, one page at a time.'
      tags:
        - 'campaign'
  /campaign/verify/:
    post:
      description: 'The code is typed by the user into a text field.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                campId:
                  description: 'The campaign identifier, as a decimal string.'
                  type: 'string'
                code:
                  description: 'The serial code as typed.'
                  type: 'string'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userId:
                  type: 'string'
              required:
                - 'campId'
                - 'code'
                - 'passwd'
                - 'target'
                - 'userId'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The redemption result.'
      summary: 'Redeem a campaign serial code.'
      tags:
        - 'campaign'
  /gamecenter/:
    post:
      description: |
        The body is a form-urlencoded string the client formats by hand with six decimal places per
        field, and it sends no explicit content type. The range is a fixed 0.27 degrees rather than
        derived from the visible map span.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                lat:
                  description: 'The centre latitude of the visible map region.'
                  examples:
                    - 35.681236
                  format: 'double'
                  type: 'number'
                long:
                  description: 'The centre longitude of the visible map region.'
                  examples:
                    - 139.767125
                  format: 'double'
                  type: 'number'
                range:
                  default: 0.27
                  description: 'The search radius in degrees. The client always sends 0.27.'
                  format: 'double'
                  type: 'number'
              required:
                - 'lat'
                - 'long'
                - 'range'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The matching locations.'
      summary: 'List arcade locations within a map region.'
      tags:
        - 'social'
  /log/play/:
    post:
      description: |
        The client drops the call entirely for tune identifiers below its minimum, which excludes
        the tutorial and preview tunes.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                device:
                  $ref: '#/components/schemas/DeviceName'
                difficulty:
                  description: 'The chart played: BASIC, MEDIUM, HARD, or SPECIAL.'
                  type: 'integer'
                jr:
                  description: |
                    Judgement-related counter. The client passes it through from the result screen
                    without interpreting it further, so its exact meaning is not recoverable here.
                  type: 'integer'
                locale:
                  $ref: '#/components/schemas/Locale'
                music_id:
                  type: 'integer'
                note:
                  description: 'The extend-note identifier when a SPECIAL chart was played.'
                  type: 'integer'
                os:
                  $ref: '#/components/schemas/SystemVersion'
                score:
                  type: 'integer'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/IdentifierParams'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'device'
                - 'difficulty'
                - 'jr'
                - 'locale'
                - 'music_id'
                - 'note'
                - 'os'
                - 'score'
                - 'target'
                - 'user_id'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'Logged, unless the body carries `Error`.'
      summary: 'Log a completed play.'
      tags:
        - 'telemetry'
  /manage_sort/:
    get:
      description: 'The region code is the only input.'
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The sort data.'
      summary: 'Fetch the sort order for the manage tab.'
      tags:
        - 'store'
  /new2/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The message.'
      summary: 'Fetch the in-app message of the day.'
      tags:
        - 'social'
  /push/token/:
    post:
      description: |
        The three fields are named positionally in the client, which is all that is known about
        them.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                p1:
                  description: 'The stored user identifier.'
                  type: 'string'
                p2:
                  description: 'The stored token or password.'
                  type: 'string'
                p3:
                  description: 'The APNs device token.'
                  type: 'string'
                target:
                  allOf:
                    - $ref: '#/components/schemas/RegionCode'
                  description: |
                    Accepted although the client does not send it, and it selects the language the
                    server answers in: with `JP`, an `Error` comes back in Japanese rather than
                    English.
              required:
                - 'p1'
                - 'p2'
                - 'p3'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            The registration result. A 200 does not mean the token was registered — the status is
            200 either way, and an `Error` in the body is what says it was not.
      summary: 'Register the APNs device token.'
      tags:
        - 'session'
  /search_master/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The master data.'
      summary: 'Fetch the arcade-location master data.'
      tags:
        - 'social'
  /startup/:
    get:
      description: |
        The first call the app makes, and the only endpoint whose query is the region code alone.
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/StartupResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The start-up payload.'
      summary: 'Fetch the start-up payload.'
      tags:
        - 'session'
  /tutorial/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                types:
                  description: |
                    The identifiers of the walkthroughs that have been seen. The ones the app
                    records are 23 (music select), 24 (customize, on entry), 25 (the settings
                    button), 29 (unlock), and 34 (customize, on completion).
                  examples:
                    - [23, 24, 34]
                  items:
                    type: 'integer'
                  type: 'array'
                user:
                  description: |
                    The identifier the start-up payload supplied, kept in the keychain. A fresh
                    install has none and sends an empty string.
                  examples:
                    - ''
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
              required:
                - 'types'
                - 'user'
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'Status recorded, unless the body carries `Error`.'
      summary: 'Report which first-run walkthroughs have been completed.'
      tags:
        - 'session'
  /unlock/:
    get:
      description: |
        The only endpoint that takes the selected theme, and one of the few that sends no
        client-info fields.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: |
            The selected theme, spelled as the client spells it. One of the three play-field
            themes: Classic, Colette, or Limelight.
          in: 'query'
          name: 'thema'
          required: true
          schema:
            type: 'integer'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The unlock listing.'
      summary: 'List the unlockable items for a theme.'
      tags:
        - 'telemetry'
  /unlocked/:
    post:
      description: |
        The one endpoint whose body is form-urlencoded rather than JSON. The client builds the
        query string itself and sends no explicit content type.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                id:
                  description: "The unlocked item's identifier within its category."
                  type: 'integer'
                target:
                  $ref: '#/components/schemas/RegionCode'
                tp:
                  description: 'The point total associated with the unlock.'
                  format: 'float'
                  type: 'number'
                type:
                  description: "The unlocked item's category."
                  type: 'integer'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
              required:
                - 'id'
                - 'target'
                - 'tp'
                - 'type'
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'Recorded, unless the body carries `Error`.'
      summary: 'Report that an item has been unlocked.'
      tags:
        - 'telemetry'
  /unlockmusic/:
    get:
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The tune identifier being unlocked.'
          in: 'query'
          name: 'music'
          required: true
          schema:
            type: 'integer'
        - description: 'A per-request random key generated by the client.'
          in: 'query'
          name: 'key'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The unlock result.'
      summary: 'Claim a tune unlock.'
      tags:
        - 'telemetry'
  /v3/age/:
    post:
      description: |
        Sent with no explicit content type. `type` is the client's purchase-limit enumeration, sent
        as a decimal string rather than a number.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                app_ver:
                  $ref: '#/components/schemas/AppVersion'
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  description: |
                    The declared bracket, as a decimal string: `0` is undeclared, `1` and `2` are
                    monthly ceilings of 5000 and 20000 yen, and anything higher means no ceiling.
                  examples:
                    - '2'
                  type: 'string'
                user_id:
                  description: |
                    The identifier the start-up payload supplied. A fresh install has none and
                    sends an empty string.
                  examples:
                    - ''
                  type: 'string'
              required:
                - 'app_ver'
                - 'target'
                - 'type'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      status:
                        description: |
                          Zero means the purchase may go ahead. The client treats every other
                          value, and a missing `status`, as a refusal and stops the purchase.
                        examples:
                          - 0
                        type: 'integer'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The verification result, unless the body carries `Error`.'
      summary: "Report the user's declared purchase-limit bracket."
      tags:
        - 'store'
  /v3/extmusicinfo/:
    get:
      description: |
        As with `packinfo`, the client-info fields are appended only for a user-initiated request.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The extend-note product identifier (the `PID` of a list entry).'
          in: 'query'
          name: 'extitem'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuidOptional'
        - $ref: '#/components/parameters/UserInfoVersionOptional'
        - $ref: '#/components/parameters/UserInfoDeviceOptional'
        - $ref: '#/components/parameters/UserInfoOsOptional'
        - $ref: '#/components/parameters/UserInfoLocaleOptional'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ExtendNoteEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The extend note.'
      summary: 'Fetch one extend note.'
      tags:
        - 'store'
  /v3/extmusiclist/:
    get:
      description: |
        An extend note is an extra SPECIAL chart for a tune that already exists. Unlike a pack, an
        extend note does carry a catalogue `Price`.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The index of the first note to return.'
          in: 'query'
          name: 'head'
          required: true
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'The maximum number of notes to return.'
          in: 'query'
          name: 'limit'
          required: true
          schema:
            default: 10
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ExtendNoteListResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of the extend-note catalogue.'
      summary: 'List purchasable extend notes (the Sequences tab), one page at a time.'
      tags:
        - 'store'
  /v3/musicinfo/:
    get:
      description: |
        Used by the manage tab to re-resolve a tune's download URL, and by the campaign screen for
        a giveaway item.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The tune identifier.'
          in: 'query'
          name: 'music'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MusicEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The tune entry.'
      summary: "Fetch one tune's catalogue entry."
      tags:
        - 'store'
  /v3/packinfo/:
    get:
      description: |
        The client-info fields are appended only when the request originates from a user action; a
        background refresh sends `target` and `pack` alone.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The pack identifier.'
          in: 'query'
          name: 'pack'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuidOptional'
        - $ref: '#/components/parameters/UserInfoVersionOptional'
        - $ref: '#/components/parameters/UserInfoDeviceOptional'
        - $ref: '#/components/parameters/UserInfoOsOptional'
        - $ref: '#/components/parameters/UserInfoLocaleOptional'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PackEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The pack.'
      summary: 'Fetch one pack, including its tune list.'
      tags:
        - 'store'
  /v3/packlist/:
    get:
      description: |
        Paged by the client, which requests `head` as the count already fetched plus one, with
        `limit` fixed at 10.

        No pack entry carries a price, confirmed against the live endpoint and not merely inferred
        from what the client parses. In the shipped app a pack is priced entirely through its
        StoreKit product, which is why a build with no App Store record behind it shows a pack with
        no amount, and why there is nothing on the server to fall back to.
      parameters:
        - $ref: '#/components/parameters/Target'
        - description: 'The one-based index of the first pack to return.'
          in: 'query'
          name: 'head'
          required: true
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'The maximum number of packs to return. The client always sends 10.'
          in: 'query'
          name: 'limit'
          required: true
          schema:
            default: 10
            type: 'integer'
        - description: "The genre to list, or the client's default genre identifier."
          in: 'query'
          name: 'genre'
          required: true
          schema:
            type: 'integer'
        - $ref: '#/components/parameters/UserInfoUuid'
        - $ref: '#/components/parameters/UserInfoVersion'
        - $ref: '#/components/parameters/UserInfoDevice'
        - $ref: '#/components/parameters/UserInfoOs'
        - $ref: '#/components/parameters/UserInfoLocale'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PackListResponse'
                  - $ref: '#/components/schemas/ServerError'
          description: 'One page of the pack catalogue.'
      summary: 'List purchasable music packs, one page at a time.'
      tags:
        - 'store'
  /v3/ssl_resource/:
    post:
      description: |
        Drives the first-run asset download, which is required — the game will not run without it.
        Sent with no explicit content type. On a fresh install, before any credentials exist,
        `user_id` and `passwd` are sent as empty strings rather than omitted.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                passwd:
                  description: 'The stored password, or an empty string on a fresh install.'
                  examples:
                    - ''
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  description: 'The stored user identifier, or an empty string on a fresh install.'
                  examples:
                    - ''
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/MusicListKey'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'passwd'
                - 'target'
                - 'user_id'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The resource manifest.'
      summary: 'Fetch the downloadable resource manifest.'
      tags:
        - 'session'
  /v3/terms/fetch/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  $ref: '#/components/schemas/TermType'
              required:
                - 'target'
                - 'type'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TermEntry'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The document.'
      summary: 'Fetch one terms document.'
      tags:
        - 'terms'
  /v3/terms/list/:
    post:
      description: |
        The title screen calls this before letting the first tap through, so an unreachable
        endpoint here blocks the title screen entirely.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
              required:
                - 'target'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - properties:
                      list:
                        items:
                          $ref: '#/components/schemas/TermEntry'
                        type: 'array'
                    type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: |
            The terms listing. A response without a `list` key is treated as a network error.
      summary: 'List the terms documents in force.'
      tags:
        - 'terms'
  /v3/terms/log/:
    post:
      description: |
        Acceptance is only recorded locally once this call returns OK, so with the endpoint
        unavailable the terms screen cannot be cleared.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  $ref: '#/components/schemas/TermType'
                user_id:
                  description: 'The stored user identifier.'
                  type: 'string'
                version:
                  description: 'The terms version the client is agreeing to.'
                  type: 'string'
              required:
                - 'target'
                - 'type'
                - 'user_id'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'Acceptance recorded, unless the body carries `Error`.'
      summary: 'Record acceptance of a terms document.'
      tags:
        - 'terms'
  /v3/verify_receipt/:
    post:
      description: |
        The body is assembled as a string by the client rather than serialised from a dictionary.
        The nonce is 62-character alphanumeric and generated per request.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                device:
                  $ref: '#/components/schemas/DeviceName'
                locale:
                  $ref: '#/components/schemas/Locale'
                nonce:
                  description: 'A per-request alphanumeric nonce.'
                  type: 'string'
                os:
                  $ref: '#/components/schemas/SystemVersion'
                passwd:
                  type: 'string'
                products:
                  description: 'The StoreKit product identifiers being verified.'
                  items:
                    type: 'string'
                  type: 'array'
                receiptdata:
                  description: 'The base64-encoded App Store receipt.'
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                userid:
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/IdentifierParams'
                version:
                  $ref: '#/components/schemas/AppVersion'
              required:
                - 'device'
                - 'locale'
                - 'nonce'
                - 'os'
                - 'passwd'
                - 'products'
                - 'receiptdata'
                - 'target'
                - 'userid'
                - 'uuid'
                - 'version'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - type: 'object'
                  - $ref: '#/components/schemas/ServerError'
          description: 'The verification result.'
      summary: 'Verify an App Store receipt and credit the purchase.'
      tags:
        - 'store'
servers:
  - description: |
      The shipped endpoint. All three parts are build-time options (`API_SCHEME`, `API_HOST`,
      `API_BASE_PATH`), so a private or replacement server can be substituted.
    url: '{scheme}://{host}{basePath}'
    variables:
      basePath:
        default: '/akx/main/cgi/'
        description: 'The `API_BASE_PATH` build option. Every path below is relative to it.'
      host:
        default: 'akx.s.konaminet.jp'
        description: 'The `API_HOST` build option.'
      scheme:
        default: 'https'
        description: 'The `API_SCHEME` build option. Plaintext is only useful for a test server.'
        enum:
          - 'http'
          - 'https'
tags:
  - description: 'Start-up, resources, and device registration.'
    name: 'session'
  - description: 'The in-app catalogue: packs, extend notes, tunes, and purchases.'
    name: 'store'
  - description: 'Terms of service listing, fetching, and acceptance.'
    name: 'terms'
  - description: 'Serial-code campaigns and their giveaway items.'
    name: 'campaign'
  - description: 'Play logs and unlock reporting.'
    name: 'telemetry'
  - description: 'Arcade location search and message-of-the-day.'
    name: 'social'
